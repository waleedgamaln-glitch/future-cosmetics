<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة العرض — فيوتشر كوزماتكس</title>
<meta name="theme-color" content="#0E4A85">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E4A85; --navy2:#072a4d; --gold:#E2B659; --cream:#FAF7F1; --rose:#E8A0B4;
    --bg: radial-gradient(1200px 800px at 85% 10%, #1b67b3 0%, transparent 60%),
          radial-gradient(900px 700px at 10% 90%, #8a4f9e55 0%, transparent 60%),
          linear-gradient(135deg, #072a4d 0%, #0E4A85 55%, #0a335e 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Cairo',system-ui,sans-serif;cursor:none}
  body.cursor{cursor:default}
  #stage{position:fixed;inset:0;background:var(--bg);background-size:cover;background-position:center;display:grid;grid-template-rows:auto 1fr auto auto}
  #stage.custom-bg::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
  #stage > *{position:relative}

  /* animated sparkles */
  .bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .bubbles span{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff8,#fff0 70%);animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-120vh) translateX(40px);opacity:0}}

  header{display:flex;align-items:center;justify-content:space-between;padding:2.2vh 3vw}
  .brand{display:flex;align-items:center;gap:1.2vw}
  .brand img{height:8vh;width:8vh;border-radius:22%;box-shadow:0 6px 24px #0006}
  .brand h1{font-size:4.2vh;font-weight:900;letter-spacing:.5px}
  .brand small{display:block;font-size:2vh;color:var(--gold);font-weight:600}
  .clock{text-align:left;direction:ltr}
  .clock .t{font-size:6vh;font-weight:800;line-height:1}
  .clock .d{font-size:2.1vh;opacity:.85;direction:rtl;text-align:left}

  main{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:3vw;padding:0 5vw;min-height:0}
  .slide-img{height:58vh;display:grid;place-items:center;position:relative}
  .slide-img .halo{position:absolute;width:52vh;height:52vh;border-radius:50%;background:radial-gradient(circle,var(--c,#E2B659) 0%,transparent 68%);opacity:.55;filter:blur(10px)}
  .slide-img img{position:relative;max-height:56vh;max-width:100%;object-fit:contain;border-radius:3vh;background:#fff;padding:2vh;box-shadow:0 30px 80px #0008}
  .slide-info .company{display:inline-block;background:#ffffff1f;border:1px solid #ffffff33;border-radius:99px;padding:.6vh 2vh;font-size:2.4vh;color:var(--gold);font-weight:700;margin-bottom:2vh}
  .slide-info h2{font-size:6vh;line-height:1.25;font-weight:900;margin-bottom:3vh;text-shadow:0 4px 20px #0005}
  .price{display:flex;align-items:baseline;gap:2vw;flex-wrap:wrap}
  .price .now{font-size:9vh;font-weight:900;color:var(--gold);line-height:1}
  .price .now small{font-size:3.4vh;margin-right:.6vw}
  .price .old{font-size:4vh;opacity:.65;text-decoration:line-through}
  .badge{display:inline-block;margin-top:3vh;background:linear-gradient(90deg,#e0436b,#f08a5d);padding:1vh 3vh;border-radius:2vh;font-size:3.6vh;font-weight:900;box-shadow:0 10px 30px #e0436b66}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(3vh) scale(.98)}to{opacity:1;transform:none}}

  .prayers{display:flex;justify-content:center;gap:1.2vw;padding:1.6vh 3vw}
  .prayers div{background:#00000033;border:1px solid #ffffff22;border-radius:1.6vh;padding:.8vh 2vw;text-align:center;min-width:11vw}
  .prayers div b{display:block;font-size:2.1vh;opacity:.85;font-weight:600}
  .prayers div span{font-size:3vh;font-weight:800;direction:ltr;display:inline-block}
  .prayers div.next{background:var(--gold);color:var(--navy2);border-color:var(--gold)}
  .prayers .count{background:transparent;border:0;min-width:auto;align-self:center;font-size:2.4vh}

  .ticker{background:#00000055;border-top:2px solid var(--gold);overflow:hidden;white-space:nowrap;padding:1.2vh 0;font-size:3vh;font-weight:700}
  .ticker span{display:inline-block;animation:tick 35s linear infinite}
  @keyframes tick{from{transform:translateX(-100vw)}to{transform:translateX(100%)}}

  /* adhan blackout */
  #black{position:fixed;inset:0;background:#000;display:none;z-index:50;place-items:center;text-align:center}
  #black.on{display:grid}
  #black p{color:#ffffff40;font-size:3vh;font-weight:600}

  /* start + settings */
  #start{position:fixed;inset:0;z-index:60;background:#000c;display:grid;place-items:center;cursor:pointer}
  #start div{text-align:center}
  #start h2{font-size:5vh;margin-bottom:1vh}
  #start p{opacity:.8;font-size:2.4vh}
  #gear{position:fixed;left:1vw;bottom:9vh;z-index:40;width:6vh;height:6vh;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:3vh;opacity:0;transition:.3s;cursor:pointer}
  body.cursor #gear{opacity:1}
  #settings{position:fixed;inset:0;z-index:70;background:#000b;display:none;place-items:center;cursor:default}
  #settings.on{display:grid}
  #settings form{background:#0b2f55;border:1px solid #ffffff33;border-radius:16px;padding:22px;width:min(560px,94vw);max-height:92vh;overflow:auto;font-size:16px}
  #settings h3{margin-bottom:12px;color:var(--gold)}
  #settings label{display:block;margin:10px 0 4px;font-weight:600}
  #settings input,#settings select,#settings textarea{width:100%;padding:9px;border-radius:8px;border:1px solid #ffffff44;background:#ffffff14;color:#fff;font:inherit}
  #settings select option{color:#000}
  #settings .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #settings .btns{display:flex;gap:10px;margin-top:16px}
  #settings button{flex:1;padding:11px;border-radius:10px;border:0;font:inherit;font-weight:800;cursor:pointer}
  #settings .save{background:var(--gold);color:var(--navy2)}
  #settings .cancel{background:#ffffff22;color:#fff}
  #settings .hint{font-size:13px;opacity:.7;margin-top:4px}
  .empty{grid-column:1/-1;text-align:center;font-size:4vh;opacity:.8}
</style>
</head>
<body>
<div id="stage">
  <div class="bubbles" id="bubbles"></div>
  <header>
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div><h1>فيوتشر كوزماتكس</h1><small id="tagline">جمالك يبدأ من هنا</small></div>
    </div>
    <div class="clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
  </header>
  <main id="slide"><div class="empty">جاري تحميل المنتجات…</div></main>
  <div class="prayers" id="prayers"></div>
  <div class="ticker"><span id="ticker"></span></div>
</div>

<div id="black"><p id="blackMsg"></p></div>

<div id="start"><div><h2>اضغط لبدء العرض</h2><p>الشاشة هتشتغل ملء الشاشة وهتفضل صاحية — وهتطفي لوحدها وقت الأذان</p></div></div>

<button id="gear" title="الإعدادات">⚙</button>
<div id="settings">
  <form id="sform">
    <h3>إعدادات الشاشة</h3>
    <label>المدينة (لمواقيت الصلاة)</label>
    <select name="city" id="citySel"></select>
    <div class="row">
      <div><label>تطفي قبل الأذان بـ (دقيقة)</label><input type="number" name="before" min="0" max="30"></div>
      <div><label>تفضل مطفية بعد الأذان (دقيقة)</label><input type="number" name="after" min="1" max="90"></div>
    </div>
    <label>صلاة الجمعة: تفضل مطفية (دقيقة)</label>
    <input type="number" name="friday" min="1" max="120">
    <label>الصلوات اللي الشاشة تطفي فيها</label>
    <div class="row" id="prayerChecks"></div>
    <label>تعديل المواعيد بالدقايق (لو في فرق عن نتيجة المسجد)</label>
    <input type="text" name="adjust" placeholder="مثال: 0,0,0,0,0">
    <div class="hint">بالترتيب: فجر، ظهر، عصر، مغرب، عشاء — مثلاً 0,2,0,1,0</div>
    <div class="row">
      <div><label>مدة كل منتج (ثانية)</label><input type="number" name="slide" min="3" max="60"></div>
      <div><label>الخلفية</label>
        <select name="theme">
          <option value="navy">كحلي ودهبي</option>
          <option value="rose">وردي ناعم</option>
          <option value="gold">دهبي فاخر</option>
          <option value="purple">بنفسجي</option>
          <option value="custom">صورة من عندي</option>
        </select></div>
    </div>
    <label>صورة خلفية (اختياري)</label>
    <input type="file" accept="image/*" id="bgFile">
    <label>شريط الأخبار والعروض</label>
    <textarea name="ticker" rows="2"></textarea>
    <label>الكلام اللي يظهر على الشاشة السودا وقت الأذان</label>
    <input type="text" name="blackMsg" placeholder="سيبه فاضي لو عايزها سودا خالص">
    <div class="row">
      <div><label>عرض المنتجات</label>
        <select name="only"><option value="all">كل المنتجات</option><option value="offers">العروض والخصومات بس</option></select></div>
      <div><label>شركة معينة (اختياري)</label><input type="text" name="company" placeholder="مثال: ميلانو"></div>
    </div>
    <div class="btns"><button type="submit" class="save">حفظ</button><button type="button" class="cancel" id="cancel">إلغاء</button></div>
    <div class="hint" id="todayTimes"></div>
  </form>
</div>

<script>
(function(){
'use strict';
const TZ = 'Africa/Cairo';
const CITIES = {
  'القاهرة':[30.0444,31.2357], 'الجيزة':[30.0131,31.2089], 'الإسكندرية':[31.2001,29.9187],
  'دمياط':[31.4165,31.8133], 'المنصورة':[31.0409,31.3785], 'طنطا':[30.7865,31.0004],
  'الزقازيق':[30.5877,31.502], 'بنها':[30.4660,31.1858], 'شبين الكوم':[30.5526,31.0090],
  'دمنهور':[31.0341,30.4682], 'كفر الشيخ':[31.1107,30.9388], 'بورسعيد':[31.2653,32.3019],
  'الإسماعيلية':[30.5965,32.2715], 'السويس':[29.9668,32.5498], 'الفيوم':[29.3084,30.8428],
  'بني سويف':[29.0661,31.0994], 'المنيا':[28.1099,30.7503], 'أسيوط':[27.1809,31.1837],
  'سوهاج':[26.5591,31.6948], 'قنا':[26.1551,32.716], 'الأقصر':[25.6872,32.6396],
  'أسوان':[24.0889,32.8998], 'الغردقة':[27.2579,33.8116], 'مرسى مطروح':[31.3543,27.2373]
};
const PNAMES = ['الفجر','الظهر','العصر','المغرب','العشاء'];
const THEMES = {
  navy: getComputedStyle(document.documentElement).getPropertyValue('--bg'),
  rose: 'radial-gradient(1000px 700px at 80% 10%,#ffd1dc 0%,transparent 60%),linear-gradient(135deg,#7a2f4f 0%,#c25b7f 55%,#8e3a5c 100%)',
  gold: 'radial-gradient(1000px 700px at 80% 10%,#f6d98a55 0%,transparent 60%),linear-gradient(135deg,#1a1408 0%,#3b2c0e 50%,#120d05 100%)',
  purple:'radial-gradient(1000px 700px at 80% 10%,#b58cff55 0%,transparent 60%),linear-gradient(135deg,#1d0f3a 0%,#4b2a8a 55%,#21114a 100%)'
};
const DEFAULTS = {
  city:'القاهرة', before:1, after:10, friday:45, slide:8, theme:'navy', adjust:'0,0,0,0,0',
  prayers:[1,1,1,1,1], ticker:'أهلاً بيكم في فيوتشر كوزماتكس ✦ أفضل الأسعار على كل مستحضرات التجميل والعناية ✦ اسأل عن عروض الكرتونة ✦',
  blackMsg:'', only:'all', company:''
};

/* ---------- storage (safe) ---------- */
function load(){
  let s = {};
  try { s = JSON.parse(localStorage.getItem('fc-screen') || '{}'); } catch(e){}
  s = Object.assign({}, DEFAULTS, s);
  const q = new URLSearchParams(location.search);       // ?city=دمياط&after=15 ... for quick TV setup
  for (const k of Object.keys(DEFAULTS)) if (q.has(k) && k !== 'prayers') s[k] = isNaN(+DEFAULTS[k]) ? q.get(k) : +q.get(k);
  return s;
}
function save(s){ try { localStorage.setItem('fc-screen', JSON.stringify(s)); } catch(e){ alert('مقدرتش أحفظ — لو الصورة كبيرة جرب صورة أصغر'); } }
function loadBg(){ try { return localStorage.getItem('fc-screen-bg'); } catch(e){ return null; } }
let S = load();

/* ---------- prayer times (Egyptian General Authority: Fajr 19.5°, Isha 17.5°, Shafi Asr) ---------- */
const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
const fix = (a,b) => { a = a - b*Math.floor(a/b); return a<0 ? a+b : a; };
function julian(y,m,d){ if(m<=2){y-=1;m+=12;} const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sun(jd){
  const D=jd-2451545, g=fix(357.529+0.98560028*D,360), q=fix(280.459+0.98564736*D,360);
  const L=fix(q+1.915*Math.sin(rad(g))+0.020*Math.sin(rad(2*g)),360), e=23.439-0.00000036*D;
  const RA=fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15,24);
  return { decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA };
}
function prayerTimes(y,m,d,lat,lng){
  const jd = julian(y,m,d) - lng/(15*24);
  const noon = t => { const e = sun(jd+t).eqt; return fix(12 - e, 24); };
  const angleTime = (a,t,ccw) => { const dc=sun(jd+t).decl, n=noon(t);
    const T = deg(Math.acos((-Math.sin(rad(a)) - Math.sin(rad(dc))*Math.sin(rad(lat))) / (Math.cos(rad(dc))*Math.cos(rad(lat)))))/15;
    return n + (ccw ? -T : T); };
  const asrTime = t => { const dc=sun(jd+t).decl; const a = -deg(Math.atan(1/(1+Math.tan(rad(Math.abs(lat-dc))))));
    return angleTime(a,t,false); };
  // two passes for accuracy
  let t = [5,12,13,18,18].map(h=>h/24);
  let r;
  for (let i=0;i<2;i++){
    r = [angleTime(19.5,t[0],true), noon(t[1]), asrTime(t[2]), angleTime(0.833,t[3],false), angleTime(17.5,t[4],false)];
    t = r.map(h=>h/24);
  }
  r[1] += 1/60;                                     // dhuhr: 1 min after zenith
  const base = Date.UTC(y,m-1,d);
  return r.map(h => base + (h - lng/15)*3600000);   // epoch ms
}
function cairoYMD(date){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(date).split('-');
  return p.map(Number);
}
function todayTimes(offsetDays){
  const [y,m,d] = cairoYMD(new Date(Date.now() + (offsetDays||0)*86400000));
  const c = CITIES[S.city] || CITIES['القاهرة'];
  const adj = String(S.adjust||'').split(',').map(x=>+x||0);
  return prayerTimes(y,m,d,c[0],c[1]).map((ms,i)=> ms + Math.round((adj[i]||0))*60000);
}
const fmtTime = ms => new Date(ms).toLocaleTimeString('ar-EG',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
const isFriday = () => new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short'}).format(new Date()) === 'Fri';

/* ---------- clock + prayer bar + blackout ---------- */
const $ = id => document.getElementById(id);
function tick(){
  const now = Date.now();
  $('time').textContent = new Date(now).toLocaleTimeString('ar-EG',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
  $('date').textContent = new Date(now).toLocaleDateString('ar-EG',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'})
    + ' — ' + new Intl.DateTimeFormat('ar-EG-u-ca-islamic-umalqura',{timeZone:TZ,day:'numeric',month:'long',year:'numeric'}).format(new Date(now));

  const times = todayTimes(0);
  let next = times.findIndex(t => t > now), nextMs, nextName;
  if (next === -1){ nextMs = todayTimes(1)[0]; nextName = PNAMES[0]; } else { nextMs = times[next]; nextName = PNAMES[next]; }
  const left = Math.max(0, Math.round((nextMs-now)/60000));
  const h = Math.floor(left/60), mi = left%60;
  $('prayers').innerHTML = times.map((t,i)=>`<div class="${i===next?'next':''}"><b>${PNAMES[i]}</b><span>${fmtTime(t)}</span></div>`).join('')
    + `<div class="count">باقي على ${nextName}: ${h?h.toLocaleString('ar-EG')+' س ':''}${mi.toLocaleString('ar-EG')} د</div>`;

  // blackout window
  let off = null;
  times.forEach((t,i)=>{
    if (!S.prayers[i]) return;
    const dur = (i===1 && isFriday()) ? S.friday : S.after;
    if (now >= t - S.before*60000 && now < t + dur*60000) off = i;
  });
  const black = $('black');
  if (off !== null){
    if (!black.classList.contains('on')){ black.classList.add('on'); pauseSlides(true); }
    $('blackMsg').textContent = S.blackMsg ? S.blackMsg.replace('{صلاة}', PNAMES[off]) : '';
  } else if (black.classList.contains('on')){
    black.classList.remove('on'); pauseSlides(false);
  }
}

/* ---------- products (read live from the store app so prices always match) ---------- */
let PRODUCTS = [], order = [], idx = 0, timer = null, paused = false;
async function loadProducts(){
  try{
    const txt = await (await fetch('index.html', {cache:'no-store'})).text();
    const key = 'const PRODUCTS = ';
    const a = txt.indexOf(key); if (a < 0) throw 0;
    const b = txt.indexOf('}];', a);
    const list = JSON.parse(txt.slice(a+key.length, b+2));
    PRODUCTS = list.filter(p => p.img && (p.stock==null || p.stock > 0) && p.price > 0);
    try { localStorage.setItem('fc-screen-cache', JSON.stringify(PRODUCTS)); } catch(e){}
  }catch(e){
    try { PRODUCTS = JSON.parse(localStorage.getItem('fc-screen-cache') || '[]'); } catch(_){}
  }
  buildOrder();
}
function pool(){
  let l = PRODUCTS;
  if (S.only === 'offers') l = l.filter(p => p.discountPct > 0 || (p.consumerPrice && p.consumerPrice > p.price));
  if (S.company) l = l.filter(p => (p.company||'').includes(S.company.trim()));
  return l.length ? l : PRODUCTS;
}
function buildOrder(){
  order = pool().slice();
  for (let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  idx = 0; showNext();
}
function showNext(){
  clearTimeout(timer);
  if (paused) return;
  const el = $('slide');
  if (!order.length){ el.innerHTML = '<div class="empty">مفيش منتجات للعرض</div>'; return; }
  if (idx >= order.length) { buildOrder(); return; }
  const p = order[idx++];
  const img = new Image();
  img.onload = () => {
    const old = p.consumerPrice && p.consumerPrice > p.price ? p.consumerPrice : null;
    const pct = p.discountPct > 0 ? Math.round(p.discountPct) : (old ? Math.round((1-p.price/old)*100) : 0);
    el.innerHTML = `
      <div class="slide-img fade" style="--c:${p.color||'#E2B659'}"><div class="halo"></div><img src="${img.src}" alt=""></div>
      <div class="slide-info fade">
        ${p.company ? `<span class="company">${esc(p.company)}</span>` : ''}
        <h2>${esc(p.name)}</h2>
        <div class="price"><span class="now">${fmtNum(p.price)}<small>جنيه</small></span>${old?`<span class="old">${fmtNum(old)}</span>`:''}</div>
        ${pct>0 ? `<div class="badge">خصم ${pct.toLocaleString('ar-EG')}٪</div>` : ''}
      </div>`;
    timer = setTimeout(showNext, S.slide*1000);
  };
  img.onerror = () => { timer = setTimeout(showNext, 50); };
  img.src = 'images/' + p.img;
}
function pauseSlides(v){ paused = v; if (v) clearTimeout(timer); else showNext(); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => (+n).toLocaleString('ar-EG',{maximumFractionDigits:2});

/* ---------- look ---------- */
function applyLook(){
  const st = $('stage'), bg = loadBg();
  if (S.theme === 'custom' && bg){ st.style.background = `url(${bg}) center/cover no-repeat`; st.classList.add('custom-bg'); }
  else { st.style.background = THEMES[S.theme] || THEMES.navy; st.classList.remove('custom-bg'); }
  $('ticker').textContent = S.ticker;
}
(function bubbles(){
  const b = $('bubbles');
  for (let i=0;i<18;i++){ const s=document.createElement('span'); const z=10+Math.random()*50;
    Object.assign(s.style,{width:z+'px',height:z+'px',left:Math.random()*100+'%',animationDuration:(12+Math.random()*18)+'s',animationDelay:(-Math.random()*20)+'s'});
    b.appendChild(s); }
})();

/* ---------- start: fullscreen + keep the TV awake ---------- */
let wake = null;
async function keepAwake(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
$('start').addEventListener('click', async () => {
  $('start').remove();
  try { await document.documentElement.requestFullscreen(); } catch(e){}
  keepAwake();
});

/* ---------- settings ---------- */
let hideT;
document.addEventListener('mousemove', () => { document.body.classList.add('cursor'); clearTimeout(hideT); hideT = setTimeout(()=>document.body.classList.remove('cursor'), 3000); });
document.addEventListener('keydown', e => { if (e.key === 's' || e.key === 'س' || e.key === 'ContextMenu') openSettings(); });
$('gear').onclick = openSettings;
$('cancel').onclick = () => $('settings').classList.remove('on');
$('citySel').innerHTML = Object.keys(CITIES).map(c=>`<option>${c}</option>`).join('');
$('prayerChecks').innerHTML = PNAMES.map((n,i)=>`<label style="margin:0;font-weight:400"><input type="checkbox" data-p="${i}" style="width:auto"> ${n}</label>`).join('');
function openSettings(){
  const f = $('sform');
  for (const k of ['city','before','after','friday','slide','theme','adjust','ticker','blackMsg','only','company']) f.elements[k].value = S[k];
  f.querySelectorAll('[data-p]').forEach(c => c.checked = !!S.prayers[+c.dataset.p]);
  $('todayTimes').textContent = 'مواعيد النهارده: ' + todayTimes(0).map((t,i)=>PNAMES[i]+' '+fmtTime(t)).join(' • ');
  $('settings').classList.add('on');
}
$('sform').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, n = {};
  for (const k of ['city','theme','adjust','ticker','blackMsg','only','company']) n[k] = f.elements[k].value;
  for (const k of ['before','after','friday','slide']) n[k] = Math.max(0, +f.elements[k].value || DEFAULTS[k]);
  n.prayers = [...f.querySelectorAll('[data-p]')].map(c => c.checked ? 1 : 0);
  const file = $('bgFile').files[0];
  if (file){
    const url = await shrink(file);
    try { localStorage.setItem('fc-screen-bg', url); n.theme = 'custom'; } catch(err){ alert('الصورة كبيرة — جرب صورة أصغر'); }
  }
  S = Object.assign({}, S, n); save(S);
  $('settings').classList.remove('on');
  applyLook(); buildOrder(); tick();
});
function shrink(file){ return new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
  const k = Math.min(1, 1920/im.width); const c = document.createElement('canvas'); c.width = im.width*k; c.height = im.height*k;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.src = r.result; }; r.readAsDataURL(file); }); }

/* ---------- go ---------- */
applyLook(); tick(); setInterval(tick, 5000);
loadProducts(); setInterval(loadProducts, 3*3600000);       // refresh prices every 3 hours
setTimeout(() => location.reload(), 24*3600000);              // daily fresh reload keeps long-running TVs healthy
})();
</script>
