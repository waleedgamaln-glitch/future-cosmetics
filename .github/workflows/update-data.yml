name: تحديث بيانات التطبيق تلقائيًا

on:
  push:
    paths:
      - 'updates/**.xls'
      - 'updates/**.xlsx'

# Needed so this workflow can commit the updated index.html back to the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات المطلوبة
        run: pip install xlrd

      - name: تشغيل التحديث
        run: python scripts/merge_updates.py

      - name: حفظ التحديث ورفعه
        run: |
          git config user.name "future-cosmetics-bot"
          git config user.email "actions@github.com"
          git add index.html تقرير_المراجعة.txt updates/
          if git diff --cached --quiet; then
            echo "لا يوجد تغييرات لحفظها"
          else
            git commit -m "تحديث بيانات تلقائي [skip ci]"
            git push
          fi
